name: Monthly report

# 지난달 변화 동향을 텔레그램으로. 주간 보고와 같은 봇·anon 키 + 해설용 Gemini 키.
# 수동 실행 시 month(YYYY-MM)를 주면 그 달을 보고한다.

on:
  schedule:
    # 매월 1일 09:40 KST (1일 00:40 UTC). 주간 보고(월 09:30)와 겹쳐도 순서가 보장되게 10분 뒤.
    - cron: '40 0 1 * *'
  workflow_dispatch:
    inputs:
      month:
        description: '보고할 달 (YYYY-MM). 비우면 지난달'
        required: false

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: node scripts/monthly-report.mjs ${MONTH:+--month=$MONTH}
        env:
          MONTH: ${{ inputs.month }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
