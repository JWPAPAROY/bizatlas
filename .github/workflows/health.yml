name: Health check

# 파이프라인이 조용히 죽는 걸 막는다.
# 실패하면 GitHub 가 워크플로 실패 메일을 보낸다 — 별도 알림 서비스가 필요 없다.
#
# 검사에 service_role 이 필요 없다. 쓰는 테이블이 전부 anon 정책으로 열려 있어서
# 빌드용으로 이미 등록된 anon 키를 그대로 쓴다.

on:
  schedule:
    # 매일 09:10 KST (00:10 UTC). 09:00 KST 수집이 끝난 직후를 본다.
    - cron: '10 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # 의존성이 없는 단일 스크립트라 npm ci 를 돌리지 않는다 (설치 시간·실패 지점 절약).
      - run: node scripts/healthcheck.mjs
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
